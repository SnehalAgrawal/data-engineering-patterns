# PostgreSQL 17 with a small fleet-tracking database, seeded on first start (postgres/*.sql).
# Host port 5433, so it does not clash with a PostgreSQL already on 5432.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: fleet
    ports:
      - '5433:5432'
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: only the real server (after seeding) listens on TCP
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U owner -d fleet']
      interval: 2s
      retries: 60
