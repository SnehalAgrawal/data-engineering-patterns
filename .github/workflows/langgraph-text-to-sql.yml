# Lint and tests for langgraph-text-to-sql: the SQL guard, the graph's control flow (with a fake model), and the
# read-only database user against a seeded PostgreSQL. No language model runs in CI.
name: langgraph-text-to-sql

on:
  push:
    paths:
      - langgraph-text-to-sql/**
      - ruff.toml
      - .github/workflows/langgraph-text-to-sql.yml
  pull_request:
    paths:
      - langgraph-text-to-sql/**
      - ruff.toml
      - .github/workflows/langgraph-text-to-sql.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: fleet
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U owner -d fleet"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    defaults:
      run:
        working-directory: langgraph-text-to-sql
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: langgraph-text-to-sql/requirements-dev.txt

      # Service containers cannot mount the repository, so the seed scripts run here, after checkout
      - name: Seed the database (schema, data, read-only user)
        env:
          PGPASSWORD: owner
        run: for f in postgres/*.sql; do psql -v ON_ERROR_STOP=1 -h localhost -p 5433 -U owner -d fleet -q -f "$f"; done

      - run: pip install -r requirements-dev.txt

      - name: Lint with the repository's Ruff config
        working-directory: .
        run: pip install -r requirements-dev.txt && ruff check .

      - run: python -m pytest -q
