# Ruff configuration for every Python example in this repository.
# Run from the repository root: ruff check .   (or: npm run lint:py)
target-version = "py310"
line-length = 120
# Each example's python/ folder (and langgraph-text-to-sql/src) holds its own local modules,
# so import sorting groups them as first-party.
src = ["*/python", "langgraph-text-to-sql"]

[lint]
# pycodestyle errors and warnings, Pyflakes, import order, bugbear (likely bugs), pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
  "E501",  # long lines: examples print aligned tables on one line
  "B905",  # zip() without strict=: lists zipped in examples are built to the same length
]
