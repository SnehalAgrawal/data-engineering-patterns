<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Kafka to Druid streaming: architecture</title>
  <desc id="d">A browser or the simulate script posts clicks to a Node.js app, which publishes each one as a JSON event to the Kafka topic "clicks". Druid's Kafka supervisor runs an ingestion task that consumes the topic continuously; events are queryable as soon as the task has them, and are later published as hourly segments to the historical process. The page asks the app for stats every 2 seconds, and the app runs Druid SQL through the router; the broker answers from the ingestion task (recent data) and the historical process (older data).</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <g font-size="15" fill="#1c1917">
    <rect x="20" y="140" width="140" height="74" rx="10" fill="#f5f5f4" stroke="#a8a29e"/>
    <text x="90" y="172" text-anchor="middle" font-weight="600">Browser</text>
    <text x="90" y="194" text-anchor="middle" font-size="13" fill="#57534e">or simulate.js</text>

    <rect x="230" y="130" width="170" height="94" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="315" y="164" text-anchor="middle" font-weight="600">Node.js app</text>
    <text x="315" y="186" text-anchor="middle" font-size="13" fill="#44403c">Express · kafkajs</text>
    <text x="315" y="206" text-anchor="middle" font-size="13" fill="#44403c">POST /click · GET /stats</text>

    <rect x="480" y="30" width="170" height="74" rx="10" fill="#f5f5f4" stroke="#a8a29e"/>
    <text x="565" y="62" text-anchor="middle" font-weight="600">Kafka</text>
    <text x="565" y="84" text-anchor="middle" font-size="13" fill="#57534e">topic: clicks</text>

    <rect x="710" y="30" width="170" height="74" rx="10" fill="#f5f5f4" stroke="#a8a29e"/>
    <text x="795" y="58" text-anchor="middle" font-weight="600">Ingestion task</text>
    <text x="795" y="78" text-anchor="middle" font-size="13" fill="#57534e">Kafka supervisor</text>
    <text x="795" y="96" text-anchor="middle" font-size="13" fill="#57534e">(MiddleManager)</text>

    <rect x="710" y="250" width="170" height="74" rx="10" fill="#f5f5f4" stroke="#a8a29e"/>
    <text x="795" y="282" text-anchor="middle" font-weight="600">Historical</text>
    <text x="795" y="304" text-anchor="middle" font-size="13" fill="#57534e">hourly segments</text>

    <rect x="460" y="250" width="170" height="74" rx="10" fill="#f5f5f4" stroke="#a8a29e"/>
    <text x="545" y="282" text-anchor="middle" font-weight="600">Router → Broker</text>
    <text x="545" y="304" text-anchor="middle" font-size="13" fill="#57534e">Druid SQL · :8888</text>
  </g>
  <g stroke="#57534e" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M160,170 L228,170"/>
    <path d="M228,196 L162,196"/>
    <path d="M400,150 L478,80"/>
    <path d="M650,67 L708,67"/>
    <path d="M795,104 L795,248"/>
    <path d="M760,104 L622,248"/>
    <path d="M710,287 L632,287"/>
    <path d="M400,206 L458,268"/>
    <path d="M458,296 L392,226"/>
  </g>
  <g font-size="12" fill="#44403c">
    <text x="194" y="160" text-anchor="middle">clicks</text>
    <text x="194" y="214" text-anchor="middle">stats</text>
    <text x="424" y="100" text-anchor="end">produce</text>
    <text x="424" y="114" text-anchor="end">key = userId</text>
    <text x="679" y="58" text-anchor="middle">consume</text>
    <text x="803" y="180" text-anchor="start">hand off</text>
    <text x="684" y="184" text-anchor="end">recent data</text>
    <text x="671" y="278" text-anchor="middle">older data</text>
    <text x="412" y="268" text-anchor="end">SQL</text>
  </g>
</svg>
